<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>發票存摺｜收好每一張發票</title>
  <style>
    :root{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#202538;background:#f6f7fb;font-synthesis:none;text-rendering:optimizeLegibility;--ink:#202538;--muted:#7b8296;--line:#e9ebf2;--purple:#6857e8;--purple-dark:#5141ce;--soft:#f0efff;--green:#168c67;--shadow:0 12px 32px rgba(32,37,56,.07)}
    *{box-sizing:border-box}body{margin:0;min-width:320px}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{max-width:1180px;margin:auto;padding:28px 30px 56px}.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:32px}.brand{display:flex;align-items:center;gap:12px}.brand-icon{width:44px;height:44px;border-radius:14px;background:var(--purple);display:grid;place-items:center;color:#fff;font-size:23px;box-shadow:0 8px 18px #6857e844}.brand h1{font-size:19px;margin:0;letter-spacing:.02em}.brand p{margin:3px 0 0;color:var(--muted);font-size:12px}.actions{display:flex;gap:10px;align-items:center}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:11px;padding:10px 15px;font-weight:650;font-size:13px;transition:.16s}.btn:hover{border-color:#c9c4fb;transform:translateY(-1px)}.btn-primary{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 5px 13px #6857e833}.btn-primary:hover{background:var(--purple-dark);color:#fff}.btn-quiet{padding:9px 11px}.hero{background:linear-gradient(115deg,#332b70,#6555dd 62%,#8d80ef);border-radius:22px;padding:27px 30px;color:white;display:flex;justify-content:space-between;align-items:center;position:relative;overflow:hidden;margin-bottom:23px}.hero:after{content:"";position:absolute;width:240px;height:240px;border:1px solid #ffffff22;border-radius:50%;right:95px;top:-150px;box-shadow:0 0 0 30px #ffffff0c,0 0 0 60px #ffffff09}.hero-copy,.hero-total{position:relative;z-index:1}.eyebrow{font-size:12px;color:#ffffffb8;letter-spacing:.08em}.hero h2{font-size:25px;margin:7px 0 5px}.hero p{margin:0;color:#ffffffc4;font-size:13px}.hero-total{text-align:right}.hero-total span{font-size:12px;color:#ffffffc4}.hero-total strong{display:block;font-size:29px;margin-top:3px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:27px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:17px 19px;box-shadow:0 3px 12px #20253805}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.stat-icon{width:31px;height:31px;border-radius:10px;display:grid;place-items:center;background:var(--soft);color:var(--purple);font-size:15px}.stat strong{display:block;font-size:22px;margin-top:11px;letter-spacing:-.02em}.stat small{color:var(--muted);font-size:11px}.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px}.section-head h2{font-size:18px;margin:0}.section-head p{margin:5px 0 0;color:var(--muted);font-size:12px}.toolbar{background:white;border:1px solid var(--line);border-radius:15px;padding:12px;display:flex;gap:10px;margin-bottom:12px}.field-control{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff;color:var(--ink);outline:none;font-size:13px}.field-control:focus,.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #6857e81a}.search{flex:1;min-width:145px}.toolbar select{min-width:145px}.table-wrap{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #20253805}.table-scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{font-size:11px;color:var(--muted);font-weight:600;background:#fbfbfd;padding:13px 17px;border-bottom:1px solid var(--line)}td{padding:14px 17px;border-bottom:1px solid #f0f1f5;font-size:13px}tbody tr:last-child td{border-bottom:0}tbody tr:hover{background:#fcfbff}.invoice-no{font-weight:700;letter-spacing:.04em}.seller{color:var(--muted);font-size:12px;margin-top:4px}.amount{font-weight:700;text-align:right}.category{display:inline-flex;background:#f2f1ff;color:#6254d4;border-radius:20px;padding:5px 9px;font-size:11px}.row-actions{display:flex;gap:6px;justify-content:flex-end}.icon-btn{border:0;background:transparent;color:var(--muted);border-radius:7px;padding:6px 8px;font-size:12px}.icon-btn:hover{color:var(--purple);background:var(--soft)}.icon-btn.delete:hover{color:#d54858;background:#fff0f1}.empty{padding:52px 20px;text-align:center;color:var(--muted)}.empty-icon{font-size:31px;margin-bottom:10px}.empty strong{display:block;color:var(--ink);font-size:14px}.empty p{font-size:12px;margin:7px 0 17px}.footer-note{text-align:center;color:#9a9fb0;font-size:11px;margin:17px 0}.notice{font-size:11px;color:var(--muted);margin:14px 2px 0}
    dialog{border:0;border-radius:20px;padding:0;width:min(520px,calc(100% - 28px));box-shadow:0 24px 80px #17172a33;color:var(--ink)}dialog::backdrop{background:#16172c77;backdrop-filter:blur(3px)}.dialog-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.dialog-head h2{font-size:18px;margin:0}.close-btn{border:0;background:#f3f4f8;border-radius:9px;width:32px;height:32px;font-size:18px;color:var(--muted)}.invoice-form{padding:18px 24px 24px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form-field{display:flex;flex-direction:column;gap:6px}.form-field.full{grid-column:1/-1}.form-field label{font-size:12px;font-weight:650}.form-field input,.form-field select,.form-field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 11px;outline:none;font-size:13px;background:#fff}.form-field textarea{resize:vertical;min-height:72px}.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}.form-hint{font-size:11px;color:var(--muted);margin:11px 0 0}.toast{position:fixed;left:50%;bottom:25px;transform:translate(-50%,15px);background:#24243a;color:white;padding:11px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.hidden{display:none!important}
    @media(max-width:700px){.app{padding:19px 15px 40px}.topbar{margin-bottom:20px}.brand p{display:none}.actions{gap:7px}.actions .btn{padding:9px 10px}.hero{padding:23px 20px}.hero h2{font-size:20px}.hero-total strong{font-size:23px}.hero:after{right:-55px}.cards{gap:9px}.stat{padding:14px 12px}.stat strong{font-size:18px}.stat-top{font-size:10px}.stat-icon{width:27px;height:27px}.toolbar{flex-wrap:wrap}.search{flex-basis:100%}.toolbar select{flex:1;min-width:0}.section-head{align-items:flex-start;gap:10px}.section-head .btn{white-space:nowrap}.form-grid{grid-template-columns:1fr}.form-field.full{grid-column:auto}}
    @media(max-width:420px){.cards{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:1/-1}.hero-total strong{font-size:20px}.hero-total span{font-size:10px}.brand h1{font-size:16px}.brand-icon{width:39px;height:39px}.actions .btn{font-size:11px}.actions #importTrigger{display:none}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><div class="brand-icon" aria-hidden="true">▤</div><div><h1>發票存摺</h1><p>把每一筆消費，收進自己的小帳本</p></div></div>
      <div class="actions"><button class="btn" id="exportBtn" type="button">匯出資料</button><button class="btn" id="importTrigger" type="button">匯入</button><button class="btn btn-primary" id="addBtn" type="button">＋ 新增發票</button><input id="importFile" type="file" accept=".json,application/json" class="hidden" aria-label="選擇 JSON 備份檔"></div>
    </header>
    <section class="hero" aria-label="本月消費摘要"><div class="hero-copy"><div class="eyebrow" id="todayLabel">我的消費紀錄</div><h2>每一張發票，都值得好好收著。</h2><p>記下日常花費，回頭看見生活的軌跡。</p></div><div class="hero-total"><span>本月消費總額</span><strong id="monthTotal">NT$ 0</strong></div></section>
    <section class="cards" aria-label="發票統計">
      <article class="stat"><div class="stat-top"><span>本月發票</span><span class="stat-icon">▤</span></div><strong id="monthCount">0 張</strong><small>本月已記錄的發票</small></article>
      <article class="stat"><div class="stat-top"><span>累計消費</span><span class="stat-icon">＄</span></div><strong id="allTotal">NT$ 0</strong><small>所有已儲存發票金額</small></article>
      <article class="stat"><div class="stat-top"><span>收錄張數</span><span class="stat-icon">✓</span></div><strong id="allCount">0 張</strong><small>你的發票存摺收藏</small></article>
    </section>
    <section>
      <div class="section-head"><div><h2>我的發票</h2><p>搜尋、整理你的消費紀錄</p></div><button class="btn btn-primary" id="addBtn2" type="button">＋ 新增發票</button></div>
      <div class="toolbar"><input id="searchInput" class="field-control search" type="search" placeholder="搜尋發票號碼、店家或備註…" aria-label="搜尋發票"><select id="monthFilter" class="field-control" aria-label="依月份篩選"><option value="all">所有月份</option></select><select id="categoryFilter" class="field-control" aria-label="依類別篩選"><option value="all">所有類別</option><option>餐飲</option><option>交通</option><option>購物</option><option>生活</option><option>娛樂</option><option>醫療</option><option>其他</option></select></div>
      <div class="table-wrap"><div class="table-scroll"><table><thead><tr><th>發票資訊</th><th>日期</th><th>類別</th><th style="text-align:right">金額</th><th style="text-align:right">操作</th></tr></thead><tbody id="invoiceRows"></tbody></table></div><div class="empty" id="emptyState"><div class="empty-icon">🧾</div><strong>還沒有發票紀錄</strong><p>新增第一張發票，開始整理你的消費吧。</p><button class="btn btn-primary" id="emptyAddBtn" type="button">新增第一張發票</button></div></div>
      <p class="notice">資料只儲存在這個瀏覽器的裝置中。建議定期匯出備份；清除瀏覽資料可能會移除紀錄。</p>
    </section>
    <p class="footer-note">發票存摺 · 簡單記錄，安心收藏</p>
  </main>
  <dialog id="invoiceDialog" aria-labelledby="dialogTitle"><div class="dialog-head"><h2 id="dialogTitle">新增發票</h2><button type="button" class="close-btn" id="closeDialog" aria-label="關閉">×</button></div><form class="invoice-form" id="invoiceForm"><input type="hidden" id="editId"><div class="form-grid">
    <div class="form-field"><label for="number">發票號碼 *</label><input id="number" name="number" maxlength="20" placeholder="例如：AB-12345678" required></div>
    <div class="form-field"><label for="date">消費日期 *</label><input id="date" name="date" type="date" required></div>
    <div class="form-field"><label for="seller">店家名稱 *</label><input id="seller" name="seller" maxlength="80" placeholder="例如：便利商店" required></div>
    <div class="form-field"><label for="amount">消費金額（NT$）*</label><input id="amount" name="amount" type="number" min="0" max="999999999" step="1" placeholder="0" required></div>
    <div class="form-field"><label for="category">消費類別</label><select id="category" name="category"><option>餐飲</option><option>交通</option><option>購物</option><option>生活</option><option>娛樂</option><option>醫療</option><option>其他</option></select></div>
    <div class="form-field"><label for="taxType">發票類型</label><select id="taxType" name="taxType"><option>電子發票</option><option>紙本發票</option><option>收據</option></select></div>
    <div class="form-field full"><label for="note">備註（選填）</label><textarea id="note" name="note" maxlength="240" placeholder="記下這筆消費的小提醒…"></textarea></div>
  </div><p class="form-hint">＊為必填欄位。發票號碼可自訂格式，方便辨識即可。</p><div class="form-actions"><button class="btn" id="cancelDialog" type="button">取消</button><button class="btn btn-primary" type="submit">儲存發票</button></div></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    (()=>{
      const STORAGE_KEY='invoice-book-v1';
      const categories=['餐飲','交通','購物','生活','娛樂','醫療','其他'];
      const $=id=>document.getElementById(id);
      const dialog=$('invoiceDialog'), form=$('invoiceForm');
      let invoices=loadInvoices(), toastTimer;
      function loadInvoices(){try{const data=JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');return Array.isArray(data)?data.filter(x=>x&&typeof x==='object'&&typeof x.id==='string'&&typeof x.number==='string'&&typeof x.date==='string'&&Number.isFinite(Number(x.amount))):[]}catch{return []}}
      function persist(){localStorage.setItem(STORAGE_KEY,JSON.stringify(invoices))}
      function escapeHTML(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
      function money(value){return 'NT$ '+Number(value||0).toLocaleString('zh-TW')}
      function monthKey(date){return String(date||'').slice(0,7)}
      function showToast(message){const el=$('toast');el.textContent=message;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2300)}
      function setMonthOptions(){const select=$('monthFilter'), selected=select.value;const months=[...new Set(invoices.map(x=>monthKey(x.date)).filter(x=>/^\d{4}-\d{2}$/.test(x)))].sort().reverse();select.innerHTML='<option value="all">所有月份</option>'+months.map(m=>`<option value="${escapeHTML(m)}">${m.replace('-',' 年 ')} 月</option>`).join('');if(months.includes(selected))select.value=selected}
      function render(){
        const now=new Date(), currentMonth=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
        $('todayLabel').textContent=now.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric'});
        const monthInvoices=invoices.filter(x=>monthKey(x.date)===currentMonth);
        $('monthTotal').textContent=money(monthInvoices.reduce((s,x)=>s+Number(x.amount),0));$('monthCount').textContent=`${monthInvoices.length} 張`;
        $('allTotal').textContent=money(invoices.reduce((s,x)=>s+Number(x.amount),0));$('allCount').textContent=`${invoices.length} 張`;
        setMonthOptions();
        const query=$('searchInput').value.trim().toLocaleLowerCase(), month=$('monthFilter').value, category=$('categoryFilter').value;
        const visible=invoices.filter(x=>{const text=[x.number,x.seller,x.note,x.taxType].join(' ').toLocaleLowerCase();return(!query||text.includes(query))&&(month==='all'||monthKey(x.date)===month)&&(category==='all'||x.category===category)}).sort((a,b)=>b.date.localeCompare(a.date)||b.id.localeCompare(a.id));
        $('invoiceRows').innerHTML=visible.map(x=>`<tr><td><div class="invoice-no">${escapeHTML(x.number)}</div><div class="seller">${escapeHTML(x.seller)}${x.taxType?' · '+escapeHTML(x.taxType):''}</div></td><td>${escapeHTML(x.date)}</td><td><span class="category">${escapeHTML(x.category||'其他')}</span></td><td class="amount">${money(x.amount)}</td><td><div class="row-actions"><button class="icon-btn" type="button" data-action="edit" data-id="${escapeHTML(x.id)}" aria-label="編輯 ${escapeHTML(x.number)}">編輯</button><button class="icon-btn delete" type="button" data-action="delete" data-id="${escapeHTML(x.id)}" aria-label="刪除 ${escapeHTML(x.number)}">刪除</button></div></td></tr>`).join('');
        $('emptyState').classList.toggle('hidden',visible.length>0);
      }
      function openNew(){form.reset();$('editId').value='';$('dialogTitle').textContent='新增發票';$('date').value=new Date().toISOString().slice(0,10);dialog.showModal();$('number').focus()}
      function openEdit(id){const x=invoices.find(v=>v.id===id);if(!x)return;form.reset();$('editId').value=x.id;$('dialogTitle').textContent='編輯發票';$('number').value=x.number;$('date').value=x.date;$('seller').value=x.seller;$('amount').value=x.amount;$('category').value=categories.includes(x.category)?x.category:'其他';$('taxType').value=x.taxType||'電子發票';$('note').value=x.note||'';dialog.showModal();$('number').focus()}
      [$('addBtn'),$('addBtn2'),$('emptyAddBtn')].forEach(b=>b.addEventListener('click',openNew));
      [$('closeDialog'),$('cancelDialog')].forEach(b=>b.addEventListener('click',()=>dialog.close()));
      dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()});
      form.addEventListener('submit',e=>{e.preventDefault();const id=$('editId').value;const number=$('number').value.trim();const duplicate=invoices.some(x=>x.number.toLocaleLowerCase()===number.toLocaleLowerCase()&&x.id!==id);if(duplicate){$('number').setCustomValidity('這個發票號碼已經存在');$('number').reportValidity();$('number').setCustomValidity('');return}const amount=Number($('amount').value);if(!Number.isFinite(amount)||amount<0){$('amount').reportValidity();return}const entry={id:id||`${Date.now()}-${Math.random().toString(36).slice(2,8)}`,number,date:$('date').value,seller:$('seller').value.trim(),amount,category:$('category').value,taxType:$('taxType').value,note:$('note').value.trim()};if(id){invoices=invoices.map(x=>x.id===id?entry:x);showToast('發票已更新')}else{invoices.push(entry);showToast('發票已新增')}persist();dialog.close();render()});
      $('invoiceRows').addEventListener('click',e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const id=btn.dataset.id;if(btn.dataset.action==='edit')openEdit(id);if(btn.dataset.action==='delete'){const item=invoices.find(x=>x.id===id);if(item&&confirm(`確定刪除「${item.number}」這張發票嗎？`)){invoices=invoices.filter(x=>x.id!==id);persist();render();showToast('發票已刪除')}}});
      $('searchInput').addEventListener('input',render);$('monthFilter').addEventListener('change',render);$('categoryFilter').addEventListener('change',render);
      $('exportBtn').addEventListener('click',()=>{const blob=new Blob([JSON.stringify(invoices,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`發票存摺備份-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);showToast('備份檔已下載')});
      $('importTrigger').addEventListener('click',()=>$('importFile').click());
      $('importFile').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=JSON.parse(await file.text());if(!Array.isArray(data)||data.some(x=>!x||typeof x!=='object'||typeof x.number!=='string'||typeof x.date!=='string'||!Number.isFinite(Number(x.amount))))throw new Error('格式錯誤');const normalized=data.map((x,i)=>({id:typeof x.id==='string'?x.id:`import-${Date.now()}-${i}`,number:x.number.slice(0,20),date:x.date,seller:String(x.seller||'未填寫店家').slice(0,80),amount:Number(x.amount),category:categories.includes(x.category)?x.category:'其他',taxType:String(x.taxType||'電子發票'),note:String(x.note||'').slice(0,240)}));if(!confirm(`匯入 ${normalized.length} 張發票？這會取代目前的 ${invoices.length} 張紀錄。`))return;invoices=normalized;persist();render();showToast(`已匯入 ${invoices.length} 張發票`)}catch{alert('無法匯入：請選擇由發票存摺匯出的有效 JSON 備份檔。')}finally{e.target.value=''}});
      render();
    })();
  </script>
</body>
</html>
