<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#25263a">
  <title>掃描收據｜發票存摺 Pro</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#25283a;background:#f6f7fb;font-synthesis:none;text-rendering:optimizeLegibility;--purple:#6857e8;--line:#e7e8f0;--muted:#777d90}*{box-sizing:border-box}body{margin:0}.page{max-width:760px;margin:auto;padding:20px 18px 56px}.bar{display:flex;align-items:center;gap:12px;padding:8px 0 22px}.back{color:var(--purple);text-decoration:none;font-weight:700}.bar h1{font-size:20px;margin:0}.card{background:white;border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px;box-shadow:0 6px 24px #24253a08}.intro{background:linear-gradient(120deg,#302b68,#715ce8);color:#fff;border:0}.intro h2{margin:0 0 7px;font-size:23px}.intro p{margin:0;color:#e5e2ff;line-height:1.6;font-size:14px}.hint{font-size:12px;color:var(--muted);line-height:1.6}.upload{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.button{border:1px solid var(--line);background:#fff;color:#25283a;padding:11px 15px;border-radius:11px;font-size:14px;font-weight:700;cursor:pointer;text-align:center}.button.primary{background:var(--purple);color:white;border-color:var(--purple)}.button:disabled{opacity:.55;cursor:wait}.upload input{position:absolute;width:1px;height:1px;opacity:0}.progress{height:8px;background:#ededf4;border-radius:8px;overflow:hidden;margin-top:13px}.progress span{display:block;width:0;height:100%;background:var(--purple);transition:width .2s}.status{font-size:13px;margin:11px 0 0;color:var(--muted)}.error{color:#bd3447}.preview{display:block;max-width:100%;max-height:360px;object-fit:contain;margin:16px auto 0;border-radius:12px;background:#f2f2f5}.fields{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field input,.field select,.field textarea{font:inherit;font-size:14px;padding:11px;border:1px solid var(--line);border-radius:10px;outline:none;width:100%}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--purple);box-shadow:0 0 0 3px #6857e81a}.field textarea{min-height:78px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:9px;margin-top:18px}.hidden{display:none!important}.warning{background:#fff8e7;border:1px solid #f1dfac;color:#725b1c;padding:12px 14px;border-radius:11px;font-size:12px;line-height:1.6;margin-top:14px}@media(max-width:520px){.page{padding:14px 12px 40px}.card{padding:17px}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.upload .button{flex:1}.intro h2{font-size:20px}}
  </style>
</head>
<body>
  <main class="page">
    <header class="bar"><a class="back" href="/">← 回到存摺</a><h1>掃描收據</h1></header>
    <section class="card intro"><h2>拍下單據，辨識後存入存摺</h2><p>選擇收據照片，系統會在瀏覽器辨識文字並填入資料。請先核對辨識結果再儲存；掃描不會自動驗證發票真偽或兌獎。</p></section>
    <section class="card">
      <strong>① 拍照或選擇收據圖片</strong>
      <p class="hint">手機請按「開啟相機」拍攝，或選取相簿照片。紙本發票請將發票號碼、日期、店家與總額拍清楚。支援 JPG、PNG、WebP，單張上限 12 MB。</p>
      <div class="upload"><label class="button primary" for="cameraFile">開啟相機</label><label class="button" for="imageFile">從相簿選取</label><input id="cameraFile" type="file" accept="image/*" capture="environment"><input id="imageFile" type="file" accept="image/*"></div>
      <img id="preview" class="preview hidden" alt="收據圖片預覽">
      <div id="progressWrap" class="hidden"><div class="progress"><span id="progressBar"></span></div><p id="status" class="status" role="status" aria-live="polite">準備辨識…</p></div>
      <p id="scanError" class="status error" role="alert"></p>
      <div class="warning">相機功能需要使用 HTTPS 網址（或 localhost）。若相機無法開啟，請改用「從相簿選取」。首次辨識需下載繁體中文語言資料，請保持網路連線。</div>
    </section>
    <form id="receiptForm" class="card hidden">
      <strong>② 核對資料後儲存</strong><p class="hint">OCR 可能會認錯字或金額，請逐欄確認。掃描結果不會直接送出，必須按下儲存。</p>
      <div class="fields">
        <div class="field"><label for="number">發票號碼 *</label><input id="number" required maxlength="24" placeholder="例如：AB-12345678"></div>
        <div class="field"><label for="date">消費日期 *</label><input id="date" type="date" required></div>
        <div class="field"><label for="seller">店家名稱 *</label><input id="seller" required maxlength="100" placeholder="請核對或輸入店家"></div>
        <div class="field"><label for="amount">總金額（NT$）*</label><input id="amount" type="number" required min="0" max="999999999" step="1" placeholder="請核對總額"></div>
        <div class="field"><label for="category">消費類別</label><select id="category"><option>其他</option><option>餐飲</option><option>交通</option><option>購物</option><option>生活</option><option>娛樂</option><option>醫療</option></select></div>
        <div class="field"><label for="taxType">單據類型</label><select id="taxType"><option>電子發票</option><option>紙本發票</option><option>收據</option></select></div>
        <div class="field full"><label for="note">備註</label><textarea id="note" maxlength="240" placeholder="可補充消費資訊"></textarea></div>
      </div>
      <p id="saveError" class="status error" role="alert"></p>
      <div class="actions"><button class="button" id="resetBtn" type="button">重新掃描</button><button class="button primary" id="saveBtn" type="submit">確認並儲存</button></div>
    </form>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@6/dist/tesseract.min.js"></script>
  <script>
    (()=>{
      const $=id=>document.getElementById(id);let worker=null;
      const categories=['餐飲','交通','購物','生活','娛樂','醫療','其他'];
      function setError(message){$('scanError').textContent=message||''}
      function dateGuess(text){let m=text.match(/(?:民國\s*)?(\d{3})\s*[年./-]\s*(\d{1,2})\s*[月./-]\s*(\d{1,2})/);if(m){const y=Number(m[1])+1911;if(y>=2000&&y<2200)return `${y}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`}m=text.match(/(20\d{2})\s*[年./-]\s*(\d{1,2})\s*[月./-]\s*(\d{1,2})/);if(m)return `${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`;m=text.match(/(20\d{2})[-/]([01]?\d)[-/]([0-3]?\d)/);return m?`${m[1]}-${String(+m[2]).padStart(2,'0')}-${String(+m[3]).padStart(2,'0')}`:''}
      function extract(text){const normalized=text.replace(/[ＯΟ]/g,'0').replace(/[Ｉ丨|]/g,'1');const invoice=normalized.match(/\b([A-Z]{2})\s*[-－]?\s*(\d{8})\b/i);let amount='';const lines=normalized.split(/\n+/);for(const line of lines){if(/總計|合計|總額|應付|TOTAL|AMOUNT/i.test(line)){const nums=line.match(/\d[\d,]*(?:\.\d{1,2})?/g);if(nums?.length)amount=nums[nums.length-1].replace(/,/g,'').split('.')[0]}}if(!amount){const candidates=[...normalized.matchAll(/(?:NT\$?\s*)?(\d{2,7}(?:,\d{3})*)\s*(?:元)?/g)].map(m=>Number(m[1].replace(/,/g,''))).filter(n=>n>0&&n<100000000);if(candidates.length)amount=String(Math.max(...candidates))}const excluded=/發票|電子|統一|編號|日期|時間|總計|合計|總額|應付|明細|稅額|電話|地址|店號|收銀|桌號|民國|\d{4,}|^[\W_]+$/;const seller=lines.map(x=>x.trim()).find(x=>x.length>=2&&x.length<=40&&!excluded.test(x)&&/[\u3400-\u9fffA-Za-z]/.test(x))||'';return{number:invoice?`${invoice[1].toUpperCase()}-${invoice[2]}`:'',date:dateGuess(normalized),amount,seller}}
      function prepareImage(file){return new Promise((resolve,reject)=>{const image=new Image(),url=URL.createObjectURL(file);image.onload=()=>{const scale=Math.min(2,2200/Math.max(image.width,image.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(image.width*scale));canvas.height=Math.max(1,Math.round(image.height*scale));const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(image,0,0,canvas.width,canvas.height);const data=ctx.getImageData(0,0,canvas.width,canvas.height);for(let i=0;i<data.data.length;i+=4){const gray=(data.data[i]*.299+data.data[i+1]*.587+data.data[i+2]*.114);const value=Math.max(0,Math.min(255,(gray-128)*1.3+128));data.data[i]=data.data[i+1]=data.data[i+2]=value}ctx.putImageData(data,0,0);URL.revokeObjectURL(url);canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('無法處理這張圖片。')),'image/jpeg',.92)},image.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('圖片無法讀取，請換一張照片。'))};image.src=url})}
      async function scan(file){if(!file)return;setError('');$('saveError').textContent='';$('receiptForm').classList.add('hidden');if(!file.type.startsWith('image/')){setError('請選擇 JPG、PNG 或其他圖片檔。');return}if(file.size>12*1024*1024){setError('圖片超過 12 MB，請先縮小或裁切。');return}$('preview').src=URL.createObjectURL(file);$('preview').classList.remove('hidden');$('progressWrap').classList.remove('hidden');$('progressBar').style.width='0%';$('status').textContent='正在準備照片…';try{if(!window.Tesseract)throw new Error('辨識程式載入失敗。請確認網路連線後重新整理頁面。');const image=await prepareImage(file);if(!worker){worker=await Tesseract.createWorker('chi_tra+eng',1,{logger:m=>{if(m.status){$('status').textContent=m.status==='recognizing text'?'正在辨識收據文字…':m.status==='loading language traineddata'?'正在下載繁體中文辨識資料…':`正在載入辨識引擎：${m.status}`}if(m.status==='recognizing text')$('progressBar').style.width=`${Math.round((m.progress||0)*100)}%`}})}$('status').textContent='正在辨識收據文字…';const result=await worker.recognize(image);const found=extract(result.data.text||'');$('number').value=found.number;$('date').value=found.date;$('seller').value=found.seller;$('amount').value=found.amount;$('taxType').value=/收據/.test(result.data.text||'')?'收據':'電子發票';$('category').value=categories.includes('其他')?'其他':'其他';$('note').value='由收據掃描辨識，請核對欄位';$('receiptForm').classList.remove('hidden');$('progressBar').style.width='100%';$('status').textContent=found.number||found.amount?'辨識完成，請核對欄位再儲存。':'已讀取圖片，但未能可靠辨識欄位；請手動補齊後儲存。';$('receiptForm').scrollIntoView({behavior:'smooth',block:'start'})}catch(error){$('status').textContent='';setError(`${error.message||'辨識失敗。'} 請保持網路連線；也可直接在下方表單手動輸入。`);$('receiptForm').classList.remove('hidden');$('date').value=new Date().toISOString().slice(0,10)}}
      $('cameraFile').addEventListener('change',e=>scan(e.target.files[0]));$('imageFile').addEventListener('change',e=>scan(e.target.files[0]));
      $('resetBtn').addEventListener('click',()=>{ $('receiptForm').classList.add('hidden');$('preview').classList.add('hidden');$('scanError').textContent='';$('cameraFile').value='';$('imageFile').value='';window.scrollTo({top:0,behavior:'smooth'})});
      $('receiptForm').addEventListener('submit',async e=>{e.preventDefault();$('saveError').textContent='';const button=$('saveBtn');button.disabled=true;button.textContent='儲存中…';try{const response=await fetch('/api/invoices',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({number:$('number').value.trim(),date:$('date').value,seller:$('seller').value.trim(),amount:Number($('amount').value),category:$('category').value,taxType:$('taxType').value,note:$('note').value.trim()})});const data=await response.json().catch(()=>({}));if(response.status===401)throw new Error('請先登入會員，再返回這裡掃描儲存。');if(!response.ok)throw new Error(data.error||'儲存失敗，請檢查欄位後重試。');alert('已儲存到你的發票存摺！');location.href='/'}catch(error){$('saveError').textContent=error.message||'連線發生問題，請稍後再試。'}finally{button.disabled=false;button.textContent='確認並儲存'}});
    })();
  </script>
</body>
</html>
